# Notes for an existing API Deployment. This file does not create a cluster.
# Apply the event migration as a one-shot Job before any writer sets capture required.
# The API command stays node apps/api/dist/server.js.
# The worker command is node apps/api/dist/event-worker.js. Use the same image digest.
# Set FAD_EVENTS_ENABLED=true on every API replica and every worker together.
# Store FAD_EVENTS_SECRET_KEY in a Secret. The key is a local AES-GCM stand-in, not a cloud KMS.
# Pausing the worker stops delivery. It does not drop events.
# Do not roll API writers back to an image that omits capture while fad_event_capture_control.required is true.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fad-event-worker
  labels:
    app.kubernetes.io/name: fad-api
    app.kubernetes.io/component: events-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fad-api
      app.kubernetes.io/component: events-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fad-api
        app.kubernetes.io/component: events-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: fad-api@sha256:replace-with-the-built-digest
          command: ["node", "apps/api/dist/event-worker.js"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: FAD_EVENTS_ENABLED
              value: "false"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
