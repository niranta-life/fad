  /v1/discovery/agents:
    post:
      tags: [Discovery]
      operationId: discoverLocalAgents
      summary: Find active agents in the caller organization
      description: |
        Requires agents:read, capabilities:read, and endpoints:read. Tag
        predicates also require tags:read. A restricted predicate also
        requires tags:restricted:read. The query stays in the caller
        organization. The directory does not call declared endpoints.
        A match is not a health, trust, or invocation decision.
        Idempotency-Key is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoveryRequest' }
      responses:
        '200':
          description: Local discovery page
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
