      summary: OAuth protected resource metadata for MCP
      security: []
      responses:
        '200':
          description: Protected resource metadata
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [resource, authorization_servers]
                properties:
                  resource: { type: string }
                  authorization_servers:
                    type: array
                    items: { type: string }
                  scopes_supported:
                    type: array
                    items: { type: string }
                  bearer_methods_supported:
                    type: array
                    items: { type: string }
