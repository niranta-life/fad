      summary: Activate an immutable draft policy
      description: |
        Requires policies:write and policies:activate, a strong If-Match, and
        Idempotency-Key. Activation does not change authorization of existing
        REST or MCP operations.
      parameters:
        - $ref: '#/components/parameters/PolicyId'
