      summary: Set own organization enforcement configuration
      description: |
        Requires a strong If-Match and an Idempotency-Key. Shadow and enforce
        require a passing single-use preflight. Off is an audited privileged
        change and does not require a preflight. Requires enforcement:manage.
      parameters:
        - { $ref: '#/components/parameters/EnforcementIfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
