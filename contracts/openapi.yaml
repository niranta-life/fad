  /mcp:
    post:
      tags: [MCP]
      operationId: mcpTransportPost
      summary: Stateless MCP JSON-RPC
      description: |
        Bearer access token only. X-FAD-API-Key is not accepted. The route
        exists only when MCP is enabled and an external issuer is configured.
        GET and DELETE do not create a session.
      security:
        - McpOAuthBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: JSON-RPC result
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Bearer challenge
          headers:
            WWW-Authenticate:
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: { type: string }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    get:
      tags: [MCP]
      operationId: mcpTransportGet
      summary: MCP session listen is not offered
      security: []
      responses:
        '405':
          description: Method not allowed. No session is created.
          headers:
            Allow:
              schema: { type: string }
    delete:
      tags: [MCP]
      operationId: mcpTransportDelete
      summary: MCP session close is not offered
      security: []
      responses:
        '405':
          description: Method not allowed. No session is created.
          headers:
            Allow:
              schema: { type: string }
