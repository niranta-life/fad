openapi: 3.1.0
info:
  title: Federated Agent Directory API
  version: 1.4.0
  description: |
    Normative public HTTP contract. Header authentication with X-FAD-API-Key
    is scoped to a single organization and principal. A supplied
    tenant/organization selector never changes the authenticated tenant.
    Health and the current organization are the Slice 0 operations. Agent
    registration and lifecycle are additive Slice 1 operations. Typed tags
    and tag search are additive Slice 2 operations. A deployment serves the
    tag routes only when typed tags are enabled. Capability versions,
    endpoint metadata, capability bindings, and local discovery are additive
    Slice 3 operations. A deployment serves those routes only when Slice 3
    is enabled. Discovery does not claim that an agent is healthy, trusted,
    or authorized for invocation. MCP at /mcp is an additive protocol. It
    does not change /v1.
servers:
  - url: https://fad.example.internal
security:
  - FadApiKey: []
tags:
  - name: Health
  - name: Organizations
  - name: Agents
  - name: Tags
  - name: Capabilities
  - name: Endpoints
  - name: Bindings
  - name: Discovery
  - name: MCP
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Process liveness (not database readiness)
      security: []
      responses:
        '200':
          description: Process is responsive
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liveness' }
              example: { status: ok }
        '503': { $ref: '#/components/responses/HealthUnavailable' }
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Ready to serve authenticated requests
      description: |
        Requires database reachability and a compatible applied schema version.
        Returns no hostnames, credential details, SQL errors or internals.
      security: []
      responses:
        '200':
          description: Ready
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example: { status: ready }
        '503': { $ref: '#/components/responses/HealthUnavailable' }
  /v1/organizations/current:
    get:
      tags: [Organizations]
      operationId: getCurrentOrganization
      summary: Return organization bound to caller's verified API key
      description: |
        Requires organizations:read. The caller cannot select an organization
        using a header, query parameter, or body. Unknown query parameters
        return 400 VALIDATION_ERROR.
      responses:
        '200':
          description: Organization for authenticated credential
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
              example:
                data:
                  id: b4fbb090-335b-4c59-bc0e-5b382ee986b5
                  name: Example Finance
                  status: active
                  created_at: '2026-10-20T12:00:00.000Z'
                meta:
                  request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda
                  api_version: v1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/agents:
    post:
      tags: [Agents]
      operationId: registerAgent
      summary: Register an agent in the authenticated organization
      description: |
        Requires agents:write and Idempotency-Key. The server chooses the agent
        id, global_id, status, revision, and audit identity. organization_id in
        the body is rejected. An identical replay returns 201 and the same agent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreate' }
      responses:
        '201':
          description: Agent registered
          headers:
            Location: { $ref: '#/components/headers/AgentLocation' }
            ETag: { $ref: '#/components/headers/AgentETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List agents in the authenticated organization
      description: |
        Requires agents:read. Ordered by created_at descending, then id
        descending. limit defaults to 25 and cannot exceed 100. Unknown query
        parameters return 400 VALIDATION_ERROR.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AgentStatus' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: One page of agents
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Get one agent
      description: |
        Requires agents:read. A missing agent and an agent in another
        organization both return 404 AGENT_NOT_FOUND.
      responses:
        '200':
          description: Agent found
          headers:
            ETag: { $ref: '#/components/headers/AgentETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    patch:
      tags: [Agents]
      operationId: updateAgent
      summary: Update agent name, description, or owner
      description: |
        Requires agents:write, Idempotency-Key, and a strong If-Match value.
        The body is a partial document. Only supplied fields change.
        description null clears the description. status cannot be changed here.
        A retired agent cannot be edited. A no-op keeps the revision.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentUpdate' }
      responses:
        '200':
          description: Current agent after the update
          headers:
            ETag: { $ref: '#/components/headers/AgentETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/agents/{agentId}/suspend:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Agents]
      operationId: suspendAgent
      summary: Suspend an agent
      description: |
        Requires agents:lifecycle. Suspended to suspended is a no-op and does
        not increase the revision. Retired to suspended returns 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleRequest' }
      responses:
        '200': { $ref: '#/components/responses/AgentChanged' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/agents/{agentId}/activate:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Agents]
      operationId: activateAgent
      summary: Activate a suspended agent
      description: |
        Requires agents:lifecycle. Active to active is a no-op. Retired is
        terminal and returns 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleRequest' }
      responses:
        '200': { $ref: '#/components/responses/AgentChanged' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/agents/{agentId}/retire:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Agents]
      operationId: retireAgent
      summary: Retire an agent
      description: |
        Requires agents:lifecycle. Retired to retired is a no-op. A retired
        agent stays readable and cannot be activated or patched.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleRequest' }
      responses:
        '200': { $ref: '#/components/responses/AgentChanged' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/tag-definitions:
    post:
      tags: [Tags]
      operationId: createTagDefinition
      summary: Create an immutable typed tag definition
      description: |
        Requires tags:define. A governed or restricted definition also requires
        tags:governance. Reserved namespaces security, compliance, and system
        must be governed and restricted. The definition cannot be changed later.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagDefinitionCreate' }
      responses:
        '201':
          description: Definition created
          headers:
            Location: { $ref: '#/components/headers/TagDefinitionLocation' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagDefinitionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/TagConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    get:
      tags: [Tags]
      operationId: listTagDefinitions
      summary: List visible tag definitions
      description: |
        Requires tags:read. Restricted definitions are omitted unless the
        caller also has tags:restricted:read. The page does not report a count
        of omitted definitions.
      parameters:
        - $ref: '#/components/parameters/TagNamespaceFilter'
        - $ref: '#/components/parameters/TagLimit'
        - $ref: '#/components/parameters/TagCursor'
      responses:
        '200':
          description: Visible definitions in namespace and key order
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagDefinitionListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/tag-definitions/{namespace}/{key}:
    parameters:
      - $ref: '#/components/parameters/TagNamespace'
      - $ref: '#/components/parameters/TagKey'
    get:
      tags: [Tags]
      operationId: getTagDefinition
      summary: Read one tag definition
      description: |
        Requires tags:read. A restricted definition without
        tags:restricted:read is the same 404 as a missing definition.
      responses:
        '200':
          description: Definition
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagDefinitionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TagDefinitionNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/agents/search:
    post:
      tags: [Tags]
      operationId: searchAgentsByTag
      summary: Search agents by exact typed tag equality
      description: |
        Read-only. Requires agents:read. Tag predicates also require tags:read.
        A restricted predicate requires tags:restricted:read before any agent
        query runs. Predicates use AND. At most 8 predicates. The agent
        response shape is the Slice 1 list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTagSearch' }
      responses:
        '200':
          description: Matching agents
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/agents/{agentId}/tags:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Tags]
      operationId: listAgentTags
      summary: List visible active tag assignments
      description: |
        Requires agents:read and tags:read. Restricted assignments are omitted
        unless the caller has tags:restricted:read. Tombstones are omitted.
        An agent outside the caller organization is the same 404 as a missing agent.
      responses:
        '200':
          description: Visible active assignments
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagAssignmentListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/agents/{agentId}/tags/{namespace}/{key}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/TagNamespace'
      - $ref: '#/components/parameters/TagKey'
    get:
      tags: [Tags]
      operationId: getAgentTag
      summary: Read one active tag assignment
      description: |
        Requires agents:read and tags:read. A restricted assignment without
        tags:restricted:read is the same 404 as a missing assignment.
        The ETag is tag-vN and does not change the agent ETag.
      responses:
        '200':
          description: Active assignment
          headers:
            ETag: { $ref: '#/components/headers/TagETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagAssignmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TagAssignmentNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    put:
      tags: [Tags]
      operationId: putAgentTag
      summary: Assign or replace one tag value
      description: |
        Requires tags:write. A governed or restricted tag also requires
        tags:governance. Send exactly one of If-None-Match * or a strong
        If-Match tag-vN. Idempotency-Key is required. A governed change
        requires reason. false and 0 are valid values. This does not change
        the agent revision.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TagIfMatch'
        - $ref: '#/components/parameters/TagIfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagAssignmentPut' }
      responses:
        '200':
          description: Assignment updated or unchanged
          headers:
            ETag: { $ref: '#/components/headers/TagETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagAssignmentResponse' }
        '201':
          description: Assignment created
          headers:
            ETag: { $ref: '#/components/headers/TagETag' }
            Location: { $ref: '#/components/headers/TagAssignmentLocation' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagAssignmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TagAssignmentNotFound' }
        '409': { $ref: '#/components/responses/TagConflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    delete:
      tags: [Tags]
      operationId: deleteAgentTag
      summary: Tombstone one tag assignment
      description: |
        Requires tags:write and a strong If-Match. A governed tag also requires
        tags:governance and X-Change-Reason. The row stays. The revision
        increases. There is no response body.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TagIfMatch'
        - $ref: '#/components/parameters/ChangeReason'
      responses:
        '204':
          description: Assignment tombstoned
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
