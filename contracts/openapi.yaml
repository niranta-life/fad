    post:
      tags: [Policies]
      operationId: disablePolicy
      summary: Disable an active policy for later evaluations
      description: |
        Requires policies:write and policies:activate. Valid only from active.
        Disabling does not change previous decision records.
      parameters:
        - $ref: '#/components/parameters/PolicyId'
        - $ref: '#/components/parameters/IdempotencyKey'
