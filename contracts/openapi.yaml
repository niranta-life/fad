          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindingResponse' }
        '201':
          description: Binding created or recreated
          headers:
            ETag: { $ref: '#/components/headers/BindingETag' }
            Location: { $ref: '#/components/headers/Location' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
