  /v1/authorization/evaluate:
    post:
      tags: [PolicyEvaluation]
      operationId: evaluateAgentAccess
      summary: Evaluate hypothetical agent access; the result is not enforced
      description: |
        Requires agents:read and either policies:evaluate:self for the caller's
        own subject or policies:evaluate:any for another subject. The decision
        is recorded and returned. It does not invoke an agent and does not
        change authorization of any existing operation. Caller-supplied tag
        values and principal state are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluationRequest' }
