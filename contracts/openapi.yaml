components:
  securitySchemes:
    FadApiKey:
      type: apiKey
      in: header
      name: X-FAD-API-Key
      description: |
        Opaque organization-scoped machine credential. Never put keys in URLs,
        request bodies, logs, telemetry, examples, or client-side applications.
    McpOAuthBearer:
      type: http
      scheme: bearer
      description: |
        OAuth access token for POST /mcp. The issuer, audience, and client
        identity come from operator configuration. This scheme is not accepted
        on /v1.
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact strong ETag, for example "agent-v2". Wildcards and weak tags are rejected.
      schema: { type: string, pattern: '^"agent-v[1-9][0-9]*"$' }
    TagNamespace:
      name: namespace
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' }
    TagKey:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' }
    TagNamespaceFilter:
      name: namespace
      in: query
      required: false
      schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' }
    TagLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    TagCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 4096 }
    TagIfMatch:
      name: If-Match
      in: header
      required: false
      description: Strong tag ETag such as "tag-v2". Weak tags, lists, and wildcards are rejected.
      schema: { type: string, pattern: '^"tag-v[1-9][0-9]*"$' }
    TagIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Exactly * when creating an assignment. Mutually exclusive with If-Match.
      schema: { type: string, enum: ['*'] }
    ChangeReason:
      name: X-Change-Reason
      in: header
      required: false
      description: Required when deleting a governed tag. 1–500 Unicode code points.
      schema: { type: string, minLength: 1 }
    CapabilityId:
      name: capabilityId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CapabilityId' }
    CapabilityVersion:
      name: version
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CapabilityVersion' }
    EndpointKey:
      name: endpointKey
      in: path
      required: true
      schema: { $ref: '#/components/schemas/EndpointKey' }
    BindingIfMatch:
      name: If-Match
      in: header
      required: false
      description: Strong binding ETag such as "cap-binding-v2". Weak tags and wildcards are rejected.
      schema: { type: string, pattern: '^"cap-binding-v[1-9][0-9]*"$' }
    BindingIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Exactly * when creating a binding. Mutually exclusive with If-Match.
      schema: { type: string, enum: ['*'] }
    EndpointIfMatch:
      name: If-Match
      in: header
      required: false
      description: Strong endpoint ETag such as "endpoint-v2". Weak tags and wildcards are rejected.
      schema: { type: string, pattern: '^"endpoint-v[1-9][0-9]*"$' }
    EndpointIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Exactly * when creating an endpoint. Mutually exclusive with If-Match.
      schema: { type: string, enum: ['*'] }
    CapabilityCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 4096 }
    CapabilityLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CapabilityIdFilter:
      name: id
      in: query
      required: false
      schema: { $ref: '#/components/schemas/CapabilityId' }
    PolicyIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong policy ETag such as "policy-v2". Weak tags and wildcards are rejected.
      schema: { type: string, pattern: '^"policy-v[1-9][0-9]*"$' }
    PolicyId:
      name: policyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PolicyStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/PolicyStatus' }
    PolicyLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PolicyCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 4096 }
    EnforcementIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong enforcement ETag such as "enforcement-v0". Weak tags and wildcards are rejected.
      schema: { type: string, pattern: '^"enforcement-v(0|[1-9][0-9]*)"$' }
    EnforcementDecisionId:
      name: decisionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    RequestId:
      description: Unique server-generated request correlation UUID.
      schema: { type: string, format: uuid }
    PrivateNoStore:
      description: For protected responses, always private and no-store.
      schema: { type: string, const: 'private, no-store' }
    NoStore:
      description: Health response caching is prohibited.
      schema: { type: string, const: no-store }
    SubscriptionETag:
      description: Strong ETag for one webhook subscription
      schema: { type: string, pattern: '^"subscription-v[1-9][0-9]*"$' }
    RetryAfter:
      description: Whole number of seconds to wait before retry.
      schema: { type: integer, minimum: 1 }
    AgentETag:
      description: Strong ETag for this agent representation.
      schema: { type: string, pattern: '^"agent-v[1-9][0-9]*"$' }
    AgentLocation:
      description: Relative URI of the created agent.
      schema: { type: string, pattern: '^/v1/agents/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' }
    TagETag:
      description: Strong ETag for one tag assignment. It does not change the agent ETag.
      schema: { type: string, pattern: '^"tag-v[1-9][0-9]*"$' }
    TagDefinitionLocation:
      description: Relative URI of the created tag definition.
      schema: { type: string }
    TagAssignmentLocation:
      description: Relative URI of the created tag assignment.
      schema: { type: string }
    Location:
      description: Relative URI of the created resource.
      schema: { type: string }
    BindingETag:
      description: Strong ETag for a capability binding. It does not change the agent ETag.
      schema: { type: string, pattern: '^"cap-binding-v[1-9][0-9]*"$' }
    EndpointETag:
      description: Strong ETag for an endpoint. It does not change the agent ETag.
      schema: { type: string, pattern: '^"endpoint-v[1-9][0-9]*"$' }
    PolicyETag:
      description: Strong ETag for this policy representation. It does not change an agent ETag.
      schema: { type: string, pattern: '^"policy-v[1-9][0-9]*"$' }
    EnforcementETag:
      description: Strong ETag for the enforcement configuration. It does not change an agent ETag.
      schema: { type: string, pattern: '^"enforcement-v(0|[1-9][0-9]*)"$' }
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ready, not_ready] }
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        status: { type: string, enum: [active, suspended] }
        created_at: { type: string, format: date-time }
    ResponseMeta:
      type: object
      additionalProperties: true
      required: [request_id, api_version]
      properties:
        request_id: { type: string, format: uuid }
        api_version: { type: string, const: v1 }
    OrganizationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Organization' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ErrorData:
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
        message: { type: string, minLength: 1 }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error: { $ref: '#/components/schemas/ErrorData' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    HealthUnavailable:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: not_ready }
    AgentStatus:
      type: string
      enum: [active, suspended, retired]
      description: Directory status only. It is not an invocation permission.
    Agent:
      type: object
      additionalProperties: false
      required: [id, global_id, organization_id, name, description, owner_principal_id, status, revision, created_at, updated_at, created_by, updated_by]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        global_id:
          type: string
          readOnly: true
          description: Immutable urn:fad:agent:<organization_uuid>:<agent_uuid>. Derived, not stored as a client field.
          pattern: '^urn:fad:agent:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        organization_id: { type: string, format: uuid, readOnly: true }
        name:
          type: string
          minLength: 1
          description: 1–160 Unicode code points after NFC trim. No control characters.
        description:
          type: string
          description: 0–2000 Unicode code points. Empty when omitted on create or cleared with null on update.
        owner_principal_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AgentStatus' }
        revision: { type: integer, minimum: 1, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
    AgentCreate:
      type: object
      additionalProperties: false
      required: [name, owner_principal_id]
      properties:
        name:
          type: string
          minLength: 1
          description: 1–160 Unicode code points after NFC trim.
        description:
          type: string
          description: Optional. 0–2000 Unicode code points. Null is rejected on create.
        owner_principal_id: { type: string, format: uuid }
    AgentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          description: 1–160 Unicode code points after NFC trim.
        description:
          type: [string, 'null']
          description: Null clears the description. Omit the field to leave it unchanged.
        owner_principal_id: { type: string, format: uuid }
    LifecycleRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: 1–500 Unicode code points after NFC trim. Stored in lifecycle history, not on the agent.
    PageMeta:
      type: object
      additionalProperties: false
      required: [request_id, api_version, limit, next_cursor]
      properties:
        request_id: { type: string, format: uuid }
        api_version: { type: string, const: v1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        next_cursor: { type: [string, 'null'] }
    AgentResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Agent' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AgentListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Agent' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    TagType:
      type: string
      enum: [string, integer, boolean, enum]
    TagVisibility:
      type: string
      enum: [internal, restricted]
    TagScalar:
      description: |
        String, integer, or boolean. The definition chooses the type.
        String length is counted in Unicode code points, not UTF-16 units.
      oneOf:
        - type: string
          minLength: 1
        - type: integer
          minimum: -1000000000
          maximum: 1000000000
        - type: boolean
    TagDefinitionCreate:
      type: object
      additionalProperties: false
      required: [namespace, key, value_type, governed, visibility]
      properties:
        namespace: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' }
        key: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' }
        value_type: { $ref: '#/components/schemas/TagType' }
        enum_values:
          type: array
          uniqueItems: true
          minItems: 2
          maxItems: 32
          items: { type: string, minLength: 1 }
        governed: { type: boolean }
        visibility: { $ref: '#/components/schemas/TagVisibility' }
        description: { type: string }
    TagDefinition:
      type: object
      additionalProperties: false
      required: [organization_id, namespace, key, value_type, enum_values, governed, visibility, description, created_by, created_at]
      properties:
        organization_id: { type: string, format: uuid, readOnly: true }
        namespace: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' }
        key: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' }
        value_type: { $ref: '#/components/schemas/TagType' }
        enum_values:
          type: [array, 'null']
          items: { type: string }
        governed: { type: boolean }
        visibility: { $ref: '#/components/schemas/TagVisibility' }
        description: { type: string }
        created_by: { type: string, format: uuid, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
    TagAssignmentPut:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { $ref: '#/components/schemas/TagScalar' }
        reason:
          type: string
          minLength: 1
          description: Required when the definition is governed. Counted in Unicode code points.
    TagAssignment:
      type: object
      additionalProperties: false
      required: [agent_id, namespace, key, value, revision, governed, visibility, created_by, updated_by, created_at, updated_at]
      properties:
        agent_id: { type: string, format: uuid, readOnly: true }
        namespace: { type: string, readOnly: true }
        key: { type: string, readOnly: true }
        value: { $ref: '#/components/schemas/TagScalar' }
        revision: { type: integer, format: int64, minimum: 1, readOnly: true }
        governed: { type: boolean, readOnly: true }
        visibility: { $ref: '#/components/schemas/TagVisibility' }
        created_by: { type: string, format: uuid, readOnly: true }
        updated_by: { type: string, format: uuid, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    TagPredicate:
      type: object
      additionalProperties: false
      required: [namespace, key, operator, value]
      properties:
        namespace: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' }
        key: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' }
        operator: { type: string, const: eq }
        value: { $ref: '#/components/schemas/TagScalar' }
    AgentTagSearch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        tags:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/TagPredicate' }
        status: { $ref: '#/components/schemas/AgentStatus' }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
        cursor: { type: string, minLength: 1, maxLength: 4096 }
    TagDefinitionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/TagDefinition' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    TagDefinitionListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TagDefinition' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    TagAssignmentResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/TagAssignment' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    TagAssignmentListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/TagAssignment' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CapabilityId:
      type: string
      minLength: 3
      maxLength: 164
      pattern: '^[a-z][a-z0-9_-]{0,39}(\.[a-z][a-z0-9_-]{0,39}){1,3}$'
      description: Two to four lowercase segments separated by dots.
    CapabilityVersion:
      type: string
      maxLength: 32
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      description: MAJOR.MINOR.PATCH. Each component is at most 2147483647.
    EndpointKey:
      type: string
      minLength: 1
      maxLength: 40
      pattern: '^[a-z][a-z0-9_-]{0,39}$'
    CapabilityContract:
      type: object
      additionalProperties: true
      description: A self-contained JSON Schema Draft 2020-12 object. $ref and remote schemas are rejected.
    CapabilityPublish:
      type: object
      additionalProperties: false
      required: [id, version, display_name, input_schema, output_schema]
      properties:
        id: { $ref: '#/components/schemas/CapabilityId' }
        version: { $ref: '#/components/schemas/CapabilityVersion' }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        input_schema: { $ref: '#/components/schemas/CapabilityContract' }
        output_schema: { $ref: '#/components/schemas/CapabilityContract' }
    Capability:
      type: object
      additionalProperties: false
      required: [id, version, organization_id, display_name, description, input_schema, output_schema, contract_sha256, verification, published_by, published_at]
      properties:
        id: { $ref: '#/components/schemas/CapabilityId' }
        version: { $ref: '#/components/schemas/CapabilityVersion' }
        organization_id: { type: string, format: uuid }
        display_name: { type: string }
        description: { type: string }
        input_schema: { $ref: '#/components/schemas/CapabilityContract' }
        output_schema: { $ref: '#/components/schemas/CapabilityContract' }
        contract_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        verification: { type: string, const: self_declared }
        published_by: { type: string, format: uuid }
        published_at: { type: string, format: date-time }
    EndpointProtocol:
      type: string
      enum: [a2a, mcp, http_json]
    EndpointAuthScheme:
      type: string
      enum: [oauth2, mtls, api_key, none]
      description: A declaration of the scheme. It is not a credential.
    EndpointPut:
      type: object
      additionalProperties: false
      required: [protocol, url, auth_scheme]
      properties:
        protocol: { $ref: '#/components/schemas/EndpointProtocol' }
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Absolute HTTPS URL. No userinfo, query, fragment, credentials, or IP literal.
        auth_scheme: { $ref: '#/components/schemas/EndpointAuthScheme' }
        enabled: { type: boolean, default: true }
    Endpoint:
      type: object
      additionalProperties: false
      required: [agent_id, key, protocol, url, auth_scheme, enabled, revision, verification, created_by, updated_by, created_at, updated_at]
      properties:
        agent_id: { type: string, format: uuid }
        key: { $ref: '#/components/schemas/EndpointKey' }
        protocol: { $ref: '#/components/schemas/EndpointProtocol' }
        url: { type: string, format: uri }
        auth_scheme: { $ref: '#/components/schemas/EndpointAuthScheme' }
        enabled: { type: boolean }
        revision: { type: integer, minimum: 1 }
        verification: { type: string, const: self_declared }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BindingPut:
      type: object
      additionalProperties: false
      required: [version, endpoint_key]
      properties:
        version: { $ref: '#/components/schemas/CapabilityVersion' }
        endpoint_key: { $ref: '#/components/schemas/EndpointKey' }
    Binding:
      type: object
      additionalProperties: false
      required: [agent_id, capability_id, version, endpoint_key, revision, verification, created_by, updated_by, created_at, updated_at]
      properties:
        agent_id: { type: string, format: uuid }
        capability_id: { $ref: '#/components/schemas/CapabilityId' }
        version: { $ref: '#/components/schemas/CapabilityVersion' }
        endpoint_key: { $ref: '#/components/schemas/EndpointKey' }
        revision: { type: integer, minimum: 1 }
        verification: { type: string, const: self_declared }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DiscoveryCapability:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/CapabilityId' }
        version: { $ref: '#/components/schemas/CapabilityVersion' }
    DiscoveryRequest:
      type: object
      additionalProperties: false
      required: [capability]
      description: Local query. A match is not invocation authority or liveness.
      properties:
        capability: { $ref: '#/components/schemas/DiscoveryCapability' }
        tags:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/TagPredicate' }
        protocols:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: '#/components/schemas/EndpointProtocol' }
        limit: { type: integer, minimum: 1, maximum: 50, default: 25 }
        cursor: { type: string, minLength: 1, maxLength: 4096 }
    DiscoveryBoundCapability:
      type: object
      additionalProperties: false
      required: [id, version, verification]
      properties:
        id: { $ref: '#/components/schemas/CapabilityId' }
        version: { $ref: '#/components/schemas/CapabilityVersion' }
        verification: { type: string, const: self_declared }
    DiscoveryMatch:
      type: object
      additionalProperties: false
      required: [agent, capability, binding, endpoint, invocation_authorization, availability]
      properties:
        agent: { $ref: '#/components/schemas/Agent' }
        capability: { $ref: '#/components/schemas/DiscoveryBoundCapability' }
        binding: { $ref: '#/components/schemas/Binding' }
        endpoint: { $ref: '#/components/schemas/Endpoint' }
        invocation_authorization: { type: string, const: not_evaluated }
        availability: { type: string, const: not_checked }
    CapabilityResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Capability' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    EndpointResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Endpoint' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    BindingResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Binding' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CapabilityListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    EndpointListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Endpoint' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    BindingListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Binding' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    DiscoveryResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DiscoveryMatch' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    PolicyAction:
      type: string
      enum: [agent.read, agent.discover, agent.invoke, agent.update, agent.suspend]
    PolicyEffect:
      type: string
      enum: [allow, deny]
    PolicyStatus:
      type: string
      enum: [draft, active, disabled]
    PolicyTagPredicate:
      type: object
      additionalProperties: false
      required: [namespace, key, operator, value]
      properties:
        namespace: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' }
        key: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' }
        operator: { type: string, const: eq }
        value:
          oneOf:
            - { type: string, minLength: 1, maxLength: 128 }
            - { type: integer, minimum: -1000000000, maximum: 1000000000 }
            - { type: boolean }
    PolicySubjects:
      type: object
      additionalProperties: false
      required: [principal_ids]
      properties:
        principal_ids:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: { type: string, format: uuid }
    PolicyResourceSelector:
      type: object
      additionalProperties: false
      required: [type]
      anyOf:
        - { required: [agent_ids] }
        - { required: [tags_all] }
      properties:
        type: { const: agent }
        agent_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        tags_all:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/PolicyTagPredicate' }
    PolicyDefinitionInput:
      type: object
      additionalProperties: false
      required: [name, effect, actions, subjects, resource]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000, default: '' }
        effect: { $ref: '#/components/schemas/PolicyEffect' }
        actions:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/PolicyAction' }
        subjects: { $ref: '#/components/schemas/PolicySubjects' }
        resource: { $ref: '#/components/schemas/PolicyResourceSelector' }
        supersedes_policy_id:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
          description: Optional same-tenant policy id. It does not disable that policy.
    Policy:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, description, effect, actions, subjects, resource, status, revision, contains_restricted_tags, supersedes_policy_id, created_at, updated_at, activated_at, disabled_at, created_by, updated_by]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        effect: { $ref: '#/components/schemas/PolicyEffect' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/PolicyAction' }
        subjects: { $ref: '#/components/schemas/PolicySubjects' }
        resource: { $ref: '#/components/schemas/PolicyResourceSelector' }
        status: { $ref: '#/components/schemas/PolicyStatus' }
        revision: { type: integer, minimum: 1 }
        contains_restricted_tags: { type: boolean }
        supersedes_policy_id:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        activated_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        disabled_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
    PolicyResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Policy' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PolicyPage:
      type: object
      additionalProperties: false
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']
    PolicyListResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Policy' }
        page: { $ref: '#/components/schemas/PolicyPage' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    EvaluationSubject:
      type: object
      additionalProperties: false
      required: [principal_id]
      properties:
        principal_id: { type: string, format: uuid }
    EvaluationResource:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { const: agent }
        id: { type: string, format: uuid }
    EvaluationContext:
      type: object
      additionalProperties: false
      description: Correlation metadata only. It is not a policy input.
      properties:
        purpose: { type: string, minLength: 1, maxLength: 100 }
        correlation_id: { type: string, minLength: 1, maxLength: 128 }
    EvaluationRequest:
      type: object
      additionalProperties: false
      required: [subject, action, resource]
      properties:
        subject: { $ref: '#/components/schemas/EvaluationSubject' }
        action: { $ref: '#/components/schemas/PolicyAction' }
        resource: { $ref: '#/components/schemas/EvaluationResource' }
        context: { $ref: '#/components/schemas/EvaluationContext' }
    PolicyMatch:
      type: object
      additionalProperties: false
      required: [policy_id, revision, effect]
      properties:
        policy_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        effect: { $ref: '#/components/schemas/PolicyEffect' }
    EvaluationDecision:
      type: object
      additionalProperties: false
      required: [decision_id, decision, reason_code, enforcement, evaluated_at, resource_revision]
      properties:
        decision_id: { type: string, format: uuid }
        decision: { type: string, enum: [allow, deny] }
        reason_code:
          type: string
          enum: [EXPLICIT_ALLOW, EXPLICIT_DENY, NO_MATCHING_ALLOW, SUBJECT_INACTIVE, RESOURCE_INACTIVE]
        enforcement: { const: not_enforced }
        evaluated_at: { type: string, format: date-time }
        resource_revision: { type: integer, minimum: 1 }
        policy_set_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Omitted unless the caller may explain every considered policy.
        input_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Omitted unless the caller may explain every considered policy.
        matched_policy_count:
          type: integer
          minimum: 0
          description: Omitted rather than reveal a restricted match to a low-privilege caller.
        explanation:
          type: array
          description: Omitted unless the caller has policies:explain and may read every restricted selector.
          items: { $ref: '#/components/schemas/PolicyMatch' }
    EvaluationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/EvaluationDecision' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    EnforcementMode:
      type: string
      enum: ['off', shadow, enforce]
    EnforcementTargetMode:
      type: string
      enum: [shadow, enforce]
    EnforcementAction:
      type: string
      enum: [agent.read, agent.discover, agent.update, agent.suspend]
    EnforcementActions:
      type: array
      minItems: 0
      maxItems: 4
      uniqueItems: true
      items: { $ref: '#/components/schemas/EnforcementAction' }
    EnforcementActiveActions:
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items: { $ref: '#/components/schemas/EnforcementAction' }
    EnforcementConfig:
      type: object
      additionalProperties: false
      required: [organization_id, mode, actions, revision, updated_by, updated_at]
      properties:
        organization_id: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/EnforcementMode' }
        actions: { $ref: '#/components/schemas/EnforcementActions' }
        revision: { type: integer, minimum: 0 }
        updated_by:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        updated_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
    EnforcementConfigResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/EnforcementConfig' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    EnforcementPreflightRequest:
      type: object
      additionalProperties: false
      required: [mode, actions, reason]
      properties:
        mode: { $ref: '#/components/schemas/EnforcementTargetMode' }
        actions: { $ref: '#/components/schemas/EnforcementActiveActions' }
        reason: { type: string, minLength: 3, maxLength: 500 }
    EnforcementPreflight:
      type: object
      additionalProperties: false
      required: [preflight_id, mode, actions, passes, blockers, warnings, policy_snapshot_digest, expires_at]
      properties:
        preflight_id: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/EnforcementTargetMode' }
        actions: { $ref: '#/components/schemas/EnforcementActiveActions' }
        passes: { type: boolean }
        blockers:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 100 }
        warnings:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 100 }
        policy_snapshot_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        expires_at: { type: string, format: date-time }
    EnforcementPreflightResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/EnforcementPreflight' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    EnforcementConfigSet:
      type: object
      additionalProperties: false
      required: [mode, actions, reason, acknowledge_default_deny]
      properties:
        mode: { $ref: '#/components/schemas/EnforcementMode' }
        actions: { $ref: '#/components/schemas/EnforcementActions' }
        reason: { type: string, minLength: 3, maxLength: 500 }
        preflight_id: { type: string, format: uuid }
        acknowledge_default_deny: { type: boolean }
      allOf:
        - if:
            properties:
              mode: { const: 'off' }
            required: [mode]
          then:
            properties:
              actions: { type: array, maxItems: 0 }
            not:
              required: [preflight_id]
        - if:
            properties:
              mode: { const: shadow }
            required: [mode]
          then:
            required: [preflight_id]
            properties:
              actions: { $ref: '#/components/schemas/EnforcementActiveActions' }
        - if:
            properties:
              mode: { const: enforce }
            required: [mode]
          then:
            required: [preflight_id]
            properties:
              actions: { $ref: '#/components/schemas/EnforcementActiveActions' }
              acknowledge_default_deny: { const: true }
    EnforcementDecision:
      type: object
      additionalProperties: false
      required: [id, request_id, agent_id, actor_principal_id, operation_id, action, channel, mode, outcome, reason_code, policy_decision_id, happened_at]
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        actor_principal_id: { type: string, format: uuid }
        operation_id: { type: string, minLength: 1, maxLength: 96 }
        action: { $ref: '#/components/schemas/EnforcementAction' }
        channel: { type: string, enum: [rest, mcp] }
        mode: { $ref: '#/components/schemas/EnforcementTargetMode' }
        outcome: { type: string, enum: [allowed, denied, would_allow, would_deny] }
        reason_code: { type: string, minLength: 1, maxLength: 80 }
        policy_decision_id:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        happened_at: { type: string, format: date-time }
    EnforcementDecisionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/EnforcementDecision' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    DirectoryEventType:
      type: string
      enum:
        - com.fad.agent.registered.v1
        - com.fad.agent.updated.v1
        - com.fad.agent.lifecycle_changed.v1
        - com.fad.tag.definition_created.v1
        - com.fad.tag.assignment_changed.v1
        - com.fad.capability.published.v1
        - com.fad.agent.endpoint_changed.v1
        - com.fad.agent.capability_binding_changed.v1
        - com.fad.policy.lifecycle_changed.v1
        - com.fad.enforcement.config_changed.v1
    CloudEventData:
      type: object
      additionalProperties: false
      properties:
        agent_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        status: { type: string, minLength: 1, maxLength: 32 }
        namespace: { type: string, minLength: 1, maxLength: 64 }
        key: { type: string, minLength: 1, maxLength: 64 }
        change: { type: string, enum: [assigned, removed, upserted, deleted] }
        capability_id: { type: string, minLength: 1, maxLength: 128 }
        version: { type: string, minLength: 1, maxLength: 64 }
        endpoint_key: { type: string, minLength: 1, maxLength: 64 }
        policy_id: { type: string, format: uuid }
        mode: { type: string, enum: [off, shadow, enforce] }
    CloudEvent:
      type: object
      additionalProperties: false
      required: [specversion, id, source, type, subject, time, datacontenttype, data]
      properties:
        specversion: { type: string, const: '1.0' }
        id: { type: string, format: uuid }
        source: { type: string, minLength: 1, maxLength: 256 }
        type: { $ref: '#/components/schemas/DirectoryEventType' }
        subject: { type: string, minLength: 1, maxLength: 256 }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        data: { $ref: '#/components/schemas/CloudEventData' }
        fadsequence: { type: integer, minimum: 1 }
    EventPageMeta:
      type: object
      additionalProperties: false
      required: [request_id, api_version, limit, next_cursor, has_more]
      properties:
        request_id: { type: string, format: uuid }
        api_version: { type: string, const: v1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    EventListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CloudEvent' }
        meta: { $ref: '#/components/schemas/EventPageMeta' }
    EventResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/CloudEvent' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    EventSubscription:
      type: object
      additionalProperties: false
      required: [id, callback_url, description, event_types, status, revision, verified_at, start_after_sequence, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        callback_url: { type: string, minLength: 12, maxLength: 2048 }
        description: { type: string, maxLength: 256 }
        event_types:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/DirectoryEventType' }
        status: { type: string, enum: [pending_verification, active, paused, disabled] }
        revision: { type: integer, minimum: 1 }
        verified_at: { type: [string, 'null'], format: date-time }
        start_after_sequence: { type: [integer, 'null'], minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EventSubscriptionCreate:
      type: object
      additionalProperties: false
      required: [callback_url, event_types]
      properties:
        callback_url: { type: string, minLength: 12, maxLength: 2048 }
        description: { type: string, maxLength: 256 }
        event_types:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/DirectoryEventType' }
    EventSubscriptionPatch:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [active, paused, disabled] }
    EventSubscriptionSecret:
      type: object
      additionalProperties: false
      required: [subscription, signing_secret, signing_key_id]
      properties:
        subscription: { $ref: '#/components/schemas/EventSubscription' }
        signing_secret: { type: string, minLength: 16, maxLength: 256 }
        signing_key_id: { type: string, format: uuid }
        overlap_expires_at: { type: string, format: date-time }
    EventSubscriptionCreateResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/EventSubscriptionSecret' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    EventSubscriptionRotateResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/EventSubscriptionSecret' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    EventSubscriptionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/EventSubscription' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    EventSubscriptionListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EventSubscription' }
        meta: { $ref: '#/components/schemas/EventPageMeta' }
    EventReplay:
      type: object
      additionalProperties: false
      required: [id, subscription_id, after_sequence, through_sequence, status, created_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        after_sequence: { type: integer, minimum: 0 }
        through_sequence: { type: integer, minimum: 1 }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    EventReplayCreate:
      type: object
      additionalProperties: false
      required: [after_sequence, through_sequence, reason]
      properties:
        after_sequence: { type: integer, minimum: 0 }
        through_sequence: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 256 }
    EventReplayResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/EventReplay' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    EventDelivery:
      type: object
      additionalProperties: false
      required: [id, event_id, subscription_id, status, attempt_count, last_attempt_at, last_http_status]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, leased, succeeded, dead, cancelled] }
        attempt_count: { type: integer, minimum: 0, maximum: 12 }
        last_attempt_at: { type: [string, 'null'], format: date-time }
        last_http_status: { type: [integer, 'null'], minimum: 100, maximum: 599 }
    EventDeliveryListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EventDelivery' }
        meta: { $ref: '#/components/schemas/EventPageMeta' }

  responses:
    HealthUnavailable:
      description: Process is not ready to serve traffic
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HealthUnavailable' }
          example: { status: not_ready }
    BadRequest:
      description: Malformed request or unknown query parameters
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: VALIDATION_ERROR, message: Invalid request. }
            meta: { request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda, api_version: v1 }
    Unauthorized:
      description: Missing, unknown, invalid, expired, or revoked credential; inactive principal or organization
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: UNAUTHORIZED, message: Invalid or missing API credential. }
            meta: { request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda, api_version: v1 }
    Forbidden:
      description: Authenticated principal lacks required action scope
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: FORBIDDEN, message: Insufficient permission. }
            meta: { request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda, api_version: v1 }
    RateLimited:
      description: Caller exceeds request quota
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: RATE_LIMITED, message: Request limit exceeded. }
            meta: { request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda, api_version: v1 }
    InternalError:
      description: Unexpected application failure (internal details redacted)
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: INTERNAL_ERROR, message: Internal server error. }
            meta: { request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda, api_version: v1 }
    DependencyUnavailable:
      description: Required database or other critical dependency unavailable
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: DEPENDENCY_UNAVAILABLE, message: Service temporarily unavailable. }
            meta: { request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda, api_version: v1 }
    AgentChanged:
      description: Agent after a lifecycle transition. A no-op keeps the revision.
      headers:
        ETag: { $ref: '#/components/headers/AgentETag' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AgentResponse' }
    AgentNotFound:
      description: The agent does not exist in the authenticated organization
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: AGENT_NOT_FOUND, message: Agent not found. }
            meta: { request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda, api_version: v1 }
    AgentConflict:
      description: Retired agent cannot take this change, or the idempotency key was reused with a different request
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: INVALID_STATE_TRANSITION, message: The agent status does not allow this change. }
            meta: { request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda, api_version: v1 }
    IdempotencyConflict:
      description: Idempotency key was reused with a different normalized request
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
