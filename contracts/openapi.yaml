    get:
      tags: [PolicyEnforcement]
      operationId: getEnforcementConfig
      summary: Read own organization enforcement configuration
      description: |
        Returns off revision 0 when the organization has no stored configuration.
        Requires enforcement:read. The tenant and actor come from the verified
        credential. Request fields do not select either one.
      responses:
        '200':
          description: Current enforcement configuration
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
