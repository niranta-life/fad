  /v1/capabilities:
    post:
      tags: [Capabilities]
      operationId: publishCapability
      summary: Publish an immutable capability version
      description: |
        Requires capabilities:write. The organization comes from the credential.
        The version cannot be changed or deleted. verification is self_declared.
        The same Idempotency-Key and body returns the original 201. A new key
        for an existing version returns 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityPublish' }
      responses:
        '201':
          description: Version published
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
