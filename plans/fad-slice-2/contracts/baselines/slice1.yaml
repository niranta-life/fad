openapi: 3.1.0
info:
  title: Federated Agent Directory - Slice 1
  version: 1.0.0
  description: |
    Slice 1 agent-registration contract. All operations are tenant-scoped by the
    authenticated credential, not by a user-provided organization header.
    Idempotency keys are scoped to org, principal, method and resource path.
    No agent invocation, capabilities, tags, MCP or federation are supported.
servers:
  - url: https://fad.example.internal
security:
  - ApiKeyAuth: []
tags:
  - name: Agents
paths:
  /v1/agents:
    post:
      tags: [Agents]
      operationId: registerAgent
      summary: Register an agent
      description: Requires agents:write. Idempotency-Key is mandatory.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreate' }
      responses:
        '201':
          description: Agent registered
          headers:
            Location: { description: Relative resource URI, schema: { type: string } }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List agents in authenticated organization
      description: Requires agents:read. Ordered by created_at DESC, id DESC.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AgentStatus' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: Page of agents
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Get an agent
      description: Requires agents:read. Unknown and cross-tenant IDs both return 404.
      responses:
        '200':
          description: Agent found
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      tags: [Agents]
      operationId: updateAgent
      summary: Partially update agent metadata
      description: |
        Requires agents:write, Idempotency-Key, and a strong If-Match value.
        application/json is a partial-update document, not JSON Merge Patch.
        Only explicitly supplied fields change. description:null clears it.
        status is immutable through this endpoint. Retired agents cannot be edited.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentUpdate' }
      responses:
        '200':
          description: Updated (no-op updates retain revision)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/agents/{agentId}/suspend:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Agents]
      operationId: suspendAgent
      summary: Suspend an agent
      description: Requires agents:lifecycle. Suspended to suspended is a no-op.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleRequest' }
      responses:
        '200': { $ref: '#/components/responses/AgentChanged' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/agents/{agentId}/activate:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Agents]
      operationId: activateAgent
      summary: Activate a suspended agent
      description: Requires agents:lifecycle. Active to active is a no-op; retired is terminal.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleRequest' }
      responses:
        '200': { $ref: '#/components/responses/AgentChanged' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/agents/{agentId}/retire:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Agents]
      operationId: retireAgent
      summary: Retire an agent permanently
      description: Requires agents:lifecycle. Retired to retired is a no-op; no reactivation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleRequest' }
      responses:
        '200': { $ref: '#/components/responses/AgentChanged' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-FAD-API-Key
      description: Credential issued by Slice 0; authenticated identity resolves organization and scopes.
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact strong ETag returned by GET, such as '"agent-v2"'; wildcard is not accepted.
      schema: { type: string, pattern: '^"agent-v[1-9][0-9]*"$' }
  headers:
    ETag:
      description: Strong ETag for this agent representation.
      schema: { type: string, pattern: '^"agent-v[1-9][0-9]*"$' }
    RequestId:
      description: Request correlation identifier for this HTTP attempt.
      schema: { type: string }
  schemas:
    AgentStatus:
      type: string
      enum: [active, suspended, retired]
    Agent:
      type: object
      additionalProperties: false
      required: [id, global_id, organization_id, name, description, owner_principal_id, status, revision, created_at, updated_at, created_by, updated_by]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        global_id: { type: string, readOnly: true, description: 'urn:fad:agent:<organization_uuid>:<agent_uuid>' }
        organization_id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        owner_principal_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AgentStatus' }
        revision: { type: integer, minimum: 1, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
    AgentCreate:
      type: object
      additionalProperties: false
      required: [name, owner_principal_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 0, maxLength: 2000, default: '' }
        owner_principal_id: { type: string, format: uuid }
    AgentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 2000 }
        owner_principal_id: { type: string, format: uuid }
    LifecycleRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id, api_version]
      properties:
        request_id: { type: string }
        api_version: { type: string, const: v1 }
    PageMeta:
      type: object
      additionalProperties: false
      required: [request_id, api_version, limit, next_cursor]
      properties:
        request_id: { type: string }
        api_version: { type: string, const: v1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        next_cursor: { type: [string, 'null'] }
    AgentResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Agent' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AgentListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Agent' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    FieldError:
      type: object
      required: [field, issue]
      properties:
        field: { type: string }
        issue: { type: string }
    ApiError:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
  responses:
    AgentChanged:
      description: Agent state after transition (no-op transitions retain revision)
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AgentResponse' }
    BadRequest:
      description: Invalid syntax, cursor, idempotency key, or request parameters
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unauthorized:
      description: Missing or invalid credentials
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: Principal lacks the required permission
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: Agent does not exist in the authenticated organization
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: Invalid state transition, or conflicting idempotency request
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    PreconditionFailed:
      description: If-Match did not match current resource revision
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    PreconditionRequired:
      description: If-Match is required for mutation of an existing agent
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unprocessable:
      description: Well-formed body does not satisfy schema or business validation
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    PayloadTooLarge:
      description: Body exceeds configured size limit
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    UnsupportedMediaType:
      description: Unsupported body content type
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RateLimited:
      description: Tenant/principal rate limit exceeded
      headers:
        Retry-After: { description: Seconds to wait, schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unavailable:
      description: Required service dependency is unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
