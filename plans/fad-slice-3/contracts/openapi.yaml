openapi: 3.1.0
info:
  title: Federated Agent Directory API — Slices 0–3
  version: 1.3.0
  description: Additive combined contract for Slices 0–3. Slice 3 introduces immutable capability versions,
    agent endpoint metadata, bindings and local discovery. Existing Slices 0–2 routes and schemas are unchanged.
servers:
- url: https://fad.example.internal
security:
- ApiKeyAuth: []
tags:
- name: Health
- name: Organizations
- name: Agents
- name: TagDefinitions
- name: AgentTags
- name: TagSearch
- name: Capabilities
  description: Immutable tenant-owned capability contracts.
- name: Endpoints
  description: Versioned agent endpoint declarations; metadata, not verification.
- name: Bindings
  description: Agent capability bindings with optimistic concurrency.
- name: Discovery
  description: Read-only, local, tenant-safe agent discovery.
paths:
  /health/live:
    get:
      tags:
      - Health
      operationId: getLiveness
      summary: Process liveness (not database readiness)
      security: []
      responses:
        '200':
          description: Process is responsive
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
              example:
                status: ok
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /health/ready:
    get:
      tags:
      - Health
      operationId: getReadiness
      summary: Ready to serve authenticated requests
      description: 'Requires database reachability and a compatible applied schema version.

        Returns no hostnames, credential details, SQL errors or internals.

        '
      security: []
      responses:
        '200':
          description: Ready
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: ready
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /v1/agents:
    post:
      tags:
      - Agents
      operationId: registerAgent
      summary: Register an agent
      description: Requires agents:write. Idempotency-Key is mandatory.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      responses:
        '201':
          description: Agent registered
          headers:
            Location:
              description: Relative resource URI
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags:
      - Agents
      operationId: listAgents
      summary: List agents in authenticated organization
      description: Requires agents:read. Ordered by created_at DESC, id DESC.
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AgentStatus'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      responses:
        '200':
          description: Page of agents
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agents/search:
    post:
      tags:
      - TagSearch
      operationId: searchAgentsByTags
      summary: Read-only structured tag search
      description: Requires agents:read. If tags filter supplied, also requires tags:read; restricted tag predicates
        require tags:restricted:read. AND semantics, exact equality, max 8 predicates. Uses existing Slice
        1 Agent schema unchanged. Not a mutation and does not require Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTagSearch'
      responses:
        '200':
          description: Agents matching every predicate
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: private, no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agents/{agentId}:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    get:
      tags:
      - Agents
      operationId: getAgent
      summary: Get an agent
      description: Requires agents:read. Unknown and cross-tenant IDs both return 404.
      responses:
        '200':
          description: Agent found
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags:
      - Agents
      operationId: updateAgent
      summary: Partially update agent metadata
      description: 'Requires agents:write, Idempotency-Key, and a strong If-Match value.

        application/json is a partial-update document, not JSON Merge Patch.

        Only explicitly supplied fields change. description:null clears it.

        status is immutable through this endpoint. Retired agents cannot be edited.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          description: Updated (no-op updates retain revision)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agents/{agentId}/activate:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    post:
      tags:
      - Agents
      operationId: activateAgent
      summary: Activate a suspended agent
      description: Requires agents:lifecycle. Active to active is a no-op; retired is terminal.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agents/{agentId}/retire:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    post:
      tags:
      - Agents
      operationId: retireAgent
      summary: Retire an agent permanently
      description: Requires agents:lifecycle. Retired to retired is a no-op; no reactivation.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agents/{agentId}/suspend:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    post:
      tags:
      - Agents
      operationId: suspendAgent
      summary: Suspend an agent
      description: Requires agents:lifecycle. Suspended to suspended is a no-op.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agents/{agentId}/tags:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    get:
      tags:
      - AgentTags
      operationId: listAgentTags
      summary: List visible active assignments
      description: Requires agents:read and tags:read. Restricted tags omitted unless tags:restricted:read.
        No tombstones. Max 64 assignments per agent; no pagination.
      responses:
        '200':
          description: Readable assignments
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: private, no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagAssignmentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agents/{agentId}/tags/{namespace}/{key}:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    - $ref: '#/components/parameters/TagNamespace'
    - $ref: '#/components/parameters/TagKey'
    get:
      tags:
      - AgentTags
      operationId: getAgentTag
      summary: Read current assignment
      description: Requires agents:read and tags:read. Restricted tags additionally require tags:restricted:read.
        Hidden/missing/other-tenant => 404.
      responses:
        '200':
          description: Assignment found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: private, no-store
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/TagETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      tags:
      - AgentTags
      operationId: putAgentTag
      summary: Create or replace an agent tag assignment
      description: 'Requires tags:write; requires tags:governance for governed/restricted tag. Caller must
        supply exactly one of If-None-Match:* (no active assignment) or If-Match: strong tag ETag (existing
        active assignment). Target agent must be active or suspended, not retired.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/TagIfMatch'
      - $ref: '#/components/parameters/TagIfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAssignmentPut'
      responses:
        '200':
          description: Updated or unchanged assignment
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: private, no-store
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/TagETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagAssignmentResponse'
        '201':
          description: Created or recreated assignment
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: private, no-store
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/TagETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags:
      - AgentTags
      operationId: deleteAgentTag
      summary: Tombstone an existing assignment
      description: Requires tags:write, plus tags:governance for governed/restricted tags; If-Match and Idempotency-Key
        are mandatory. Governed deletion requires X-Change-Reason.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: If-Match
        in: header
        required: true
        description: Exact strong ETag for active tag assignment.
        schema:
          type: string
          pattern: ^"tag-v[1-9][0-9]*"$
      - $ref: '#/components/parameters/ChangeReason'
      responses:
        '204':
          description: Assignment tombstoned; no body
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/organizations/current:
    get:
      tags:
      - Organizations
      operationId: getCurrentOrganization
      summary: Return organization bound to caller's verified API key
      description: 'Requires organizations:read. The caller cannot select an organization

        using a header, query parameter, or body. Unknown query parameters

        return 400 VALIDATION_ERROR.

        '
      responses:
        '200':
          description: Organization for authenticated credential
          headers:
            X-Request-Id:
              $ref: '#/components/headers/FoundationRequestId'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
              example:
                data:
                  id: b4fbb090-335b-4c59-bc0e-5b382ee986b5
                  name: Example Finance
                  status: active
                  created_at: '2026-10-20T12:00:00.000Z'
                meta:
                  request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda
                  api_version: v1
        '400':
          $ref: '#/components/responses/FoundationBadRequest'
        '401':
          $ref: '#/components/responses/FoundationUnauthorized'
        '403':
          $ref: '#/components/responses/FoundationForbidden'
        '429':
          $ref: '#/components/responses/FoundationRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/tag-definitions:
    post:
      tags:
      - TagDefinitions
      operationId: createTagDefinition
      summary: Create immutable typed tag definition
      description: Requires tags:define; governed or restricted definitions also require tags:governance. Reserved
        security/compliance/system namespaces must be governed + restricted.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagDefinitionCreate'
      responses:
        '201':
          description: Created tag definition
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: private, no-store
              schema:
                type: string
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDefinitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags:
      - TagDefinitions
      operationId: listTagDefinitions
      summary: List readable definitions, ordered by namespace and key
      description: Requires tags:read; restricted definitions require tags:restricted:read. Omit forbidden
        definitions and any related counts.
      parameters:
      - $ref: '#/components/parameters/TagDefinitionNamespaceFilter'
      - $ref: '#/components/parameters/TagDefinitionLimit'
      - $ref: '#/components/parameters/TagDefinitionCursor'
      responses:
        '200':
          description: Readable definitions
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: private, no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDefinitionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tag-definitions/{namespace}/{key}:
    parameters:
    - $ref: '#/components/parameters/TagNamespace'
    - $ref: '#/components/parameters/TagKey'
    get:
      tags:
      - TagDefinitions
      operationId: getTagDefinition
      summary: Read tag definition
      description: Requires tags:read; restricted definitions also require tags:restricted:read. Hidden and
        nonexistent both return 404.
      responses:
        '200':
          description: Definition found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: private, no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDefinitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/capabilities:
    post:
      tags:
      - Capabilities
      operationId: publishCapability
      summary: Publish an immutable capability version
      description: Requires capabilities:write. Client-selected ID/version, immutable contract; tenant derives
        from credential; revision and verification self_declared. A duplicate ID/version is 409. Idempotency-Key
        mandatory.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityPublish'
      responses:
        '201':
          description: Version published
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
