      summary: List visible capability versions
      description: Requires capabilities:read. Sort by (id ASC, version ASC) lexical order, NOT semantic version
        ranking. Opaque signed tenant/caller-bound cursor.
      parameters:
      - $ref: '#/components/parameters/CapabilityIdFilter'
      - $ref: '#/components/parameters/CapabilityLimit'
      - $ref: '#/components/parameters/CapabilityCursor'
      responses:
        '200':
          description: Catalog page
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/capabilities/{capabilityId}/versions/{version}:
    parameters:
    - $ref: '#/components/parameters/CapabilityId'
    - $ref: '#/components/parameters/CapabilityVersion'
    get:
      tags:
      - Capabilities
      operationId: getCapabilityVersion
      summary: Get immutable capability contract
      description: Requires capabilities:read. Other-tenant and unknown capabilities both 404.
      responses:
        '200':
          description: Capability contract
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
