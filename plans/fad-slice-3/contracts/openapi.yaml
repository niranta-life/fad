  /v1/agents/{agentId}/endpoints/{endpointKey}:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    - $ref: '#/components/parameters/EndpointKey'
    get:
      tags:
      - Endpoints
      operationId: getAgentEndpoint
      summary: Get endpoint and revision
      description: Requires agents:read AND endpoints:read. Missing/tombstoned and other-tenant 404.
      responses:
        '200':
          description: Endpoint
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            ETag:
              $ref: '#/components/headers/EndpointETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      tags:
      - Endpoints
      operationId: putAgentEndpoint
      summary: Create or update endpoint metadata
      description: Requires endpoints:write. Idempotency-Key and exactly one of If-None-Match:* (create/recreate)
        or If-Match:"endpoint-vN" (update). No outbound networking. Agent cannot be retired. A live referenced
        endpoint cannot be deleted but may be disabled.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: If-Match
        in: header
        required: false
        schema: &id003
          type: string
          pattern: ^"endpoint-v[1-9][0-9]*"$
      - name: If-None-Match
        in: header
        required: false
        schema: &id004
          type: string
          const: '*'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointPut'
      responses:
        '200':
          description: Updated/no-op endpoint
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            ETag:
              $ref: '#/components/headers/EndpointETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointResponse'
        '201':
          description: New/recreated endpoint
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            ETag:
              $ref: '#/components/headers/EndpointETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointResponse'
        '400':
