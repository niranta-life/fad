        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags:
      - Endpoints
      operationId: deleteAgentEndpoint
      summary: Tombstone unreferenced endpoint
      description: Requires endpoints:write, Idempotency-Key and If-Match:"endpoint-vN". Reject 409 if currently
        referenced by active capability binding. Agent cannot be retired.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/EndpointIfMatch'
      responses:
        '204':
          description: Endpoint tombstoned
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agents/{agentId}/capabilities:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    get:
      tags:
      - Bindings
      operationId: listAgentCapabilityBindings
      summary: List active capability bindings
      description: Requires agents:read AND capabilities:read; includes self-declared provenance. Max 32 active
        bindings.
      responses:
        '200':
          description: Active capability bindings
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agents/{agentId}/capabilities/{capabilityId}:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    - $ref: '#/components/parameters/CapabilityId'
    get:
      tags:
      - Bindings
      operationId: getAgentCapabilityBinding
      summary: Get binding revision
      description: Requires agents:read AND capabilities:read. Missing/tombstoned, other tenant 404.
      responses:
        '200':
          description: Binding
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            ETag:
              $ref: '#/components/headers/BindingETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      tags:
      - Bindings
      operationId: putAgentCapabilityBinding
      summary: Bind a capability version to an endpoint
      description: Requires capabilities:write; version must be published in caller org, endpoint belongs to
        same agent and is enabled, agent is not retired. Idempotency-Key plus exactly one If-None-Match:* or
        strong If-Match:"cap-binding-vN".
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: If-Match
        in: header
        required: false
        schema: &id001
          type: string
          pattern: ^"cap-binding-v[1-9][0-9]*"$
      - name: If-None-Match
        in: header
        required: false
        schema: &id002
          type: string
          const: '*'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingPut'
      responses:
        '200':
          description: Updated/no-op binding
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            ETag:
              $ref: '#/components/headers/BindingETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingResponse'
        '201':
          description: New/recreated binding
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            ETag:
              $ref: '#/components/headers/BindingETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags:
      - Bindings
      operationId: deleteAgentCapabilityBinding
      summary: Tombstone capability binding
      description: Requires capabilities:write, Idempotency-Key and current strong binding ETag. Agent must
        not be retired.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/BindingIfMatch'
      responses:
        '204':
          description: Binding tombstoned
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/discovery/agents:
    post:
      tags:
      - Discovery
      operationId: discoverLocalAgents
      summary: Find active agents by capability, tags and protocol
      description: Requires agents:read, capabilities:read, endpoints:read. With tags also tags:read; restricted
        predicates require tags:restricted:read. Local tenant only. No remote network. No Idempotency-Key (read-only
        POST). Sorted by agent id ascending. Response does NOT imply availability or invocation permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryRequest'
      responses:
        '200':
          description: Local discovery matches
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-FAD-API-Key
      description: Credential issued by Slice 0; authenticated identity resolves organization and scopes.
    FadApiKey:
      type: apiKey
      in: header
      name: X-FAD-API-Key
      description: 'Opaque organization-scoped machine credential. Never put keys in URLs,

        request bodies, logs, telemetry, examples, or client-side applications.

        '
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact strong ETag returned by GET, such as '"agent-v2"'; wildcard is not accepted.
      schema:
        type: string
        pattern: ^"agent-v[1-9][0-9]*"$
    TagNamespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{0,39}$
        maxLength: 40
    TagKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{0,39}$
        maxLength: 40
    TagIfMatch:
      name: If-Match
      in: header
      required: false
      description: Required for update/delete of existing active assignment. Exact strong ETag such as "tag-v2";
        weak, wildcard and lists are rejected.
      schema:
        type: string
        pattern: ^"tag-v[1-9][0-9]*"$
    TagIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Required on PUT if no current assignment; must be exactly *. Mutually exclusive with If-Match.
      schema:
        type: string
        enum:
        - '*'
    ChangeReason:
      name: X-Change-Reason
      in: header
      required: false
      description: Required on governed tag deletion; UTF-8 printable text, 1–500 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 500
    TagDefinitionCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    TagDefinitionLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    TagDefinitionNamespaceFilter:
      name: namespace
      in: query
      required: false
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{0,39}$
    CapabilityId:
      name: capabilityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CapabilityId'
    CapabilityVersion:
      name: version
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CapabilityVersion'
    EndpointKey:
      name: endpointKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EndpointKey'
    BindingIfMatch:
      name: If-Match
      in: header
      required: true
      schema: *id001
      description: Required strong binding ETag for update/delete.
    BindingIfNoneMatch:
      name: If-None-Match
      in: header
      required: true
      schema: *id002
      description: Use only for creation/recreation, mutually exclusive with If-Match.
    EndpointIfMatch:
      name: If-Match
      in: header
      required: true
      schema: *id003
    EndpointIfNoneMatch:
      name: If-None-Match
      in: header
      required: true
      schema: *id004
    CapabilityCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    CapabilityLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CapabilityIdFilter:
      name: id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CapabilityId'
  headers:
    ETag:
      description: Strong ETag for this agent representation.
      schema:
        type: string
        pattern: ^"agent-v[1-9][0-9]*"$
    RequestId:
      description: Request correlation identifier for this HTTP attempt.
      schema:
        type: string
    FoundationRequestId:
      description: Unique server-generated request correlation UUID.
      schema:
        type: string
        format: uuid
    PrivateNoStore:
      description: For protected responses, always private and no-store.
      schema:
        type: string
        const: private, no-store
    NoStore:
      description: Health response caching is prohibited.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Whole number of seconds to wait before retry.
      schema:
        type: integer
        minimum: 1
    TagETag:
      description: Strong revision ETag for the individual tag assignment. Does not change the parent Agent
        ETag.
      schema:
        type: string
        pattern: ^"tag-v[1-9][0-9]*"$
    Location:
      description: Location of created resource
      schema:
        type: string
    BindingETag:
      description: Strong ETag for a binding revision.
      schema:
        type: string
        pattern: ^"cap-binding-v[1-9][0-9]*"$
    EndpointETag:
      description: Strong ETag for an endpoint revision.
      schema:
        type: string
        pattern: ^"endpoint-v[1-9][0-9]*"$
  schemas:
    AgentStatus:
      type: string
      enum:
      - active
      - suspended
      - retired
    Agent:
      type: object
      additionalProperties: false
      required:
      - id
      - global_id
      - organization_id
      - name
      - description
      - owner_principal_id
      - status
      - revision
      - created_at
      - updated_at
      - created_by
      - updated_by
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        global_id:
          type: string
          readOnly: true
          description: urn:fad:agent:<organization_uuid>:<agent_uuid>
        organization_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
        owner_principal_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AgentStatus'
        revision:
          type: integer
          minimum: 1
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid
    AgentCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - owner_principal_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 0
          maxLength: 2000
          default: ''
        owner_principal_id:
          type: string
          format: uuid
    AgentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        owner_principal_id:
          type: string
          format: uuid
    LifecycleRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
      - request_id
      - api_version
      properties:
        request_id:
          type: string
        api_version:
          type: string
          const: v1
    PageMeta:
      type: object
      additionalProperties: false
      required:
      - request_id
      - api_version
      - limit
      - next_cursor
      properties:
        request_id:
          type: string
        api_version:
          type: string
          const: v1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type:
          - string
          - 'null'
    AgentResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Agent'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AgentListResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        meta:
          $ref: '#/components/schemas/PageMeta'
    FieldError:
      type: object
      required:
      - field
      - issue
      properties:
        field:
          type: string
        issue:
          type: string
    ApiError:
      type: object
      additionalProperties: false
      required:
      - error
      - meta
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Liveness:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
    Organization:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        status:
          type: string
          enum:
          - active
          - suspended
        created_at:
          type: string
          format: date-time
    FoundationResponseMeta:
      type: object
      additionalProperties: true
      required:
      - request_id
      - api_version
      properties:
        request_id:
          type: string
          format: uuid
        api_version:
          type: string
          const: v1
    OrganizationResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Organization'
        meta:
          $ref: '#/components/schemas/FoundationResponseMeta'
    ErrorData:
      type: object
      additionalProperties: true
      required:
      - code
      - message
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          examples:
          - VALIDATION_ERROR
          - UNAUTHORIZED
          - FORBIDDEN
          - RATE_LIMITED
          - DEPENDENCY_UNAVAILABLE
          - INTERNAL_ERROR
        message:
          type: string
          minLength: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      - meta
      properties:
        error:
          $ref: '#/components/schemas/ErrorData'
        meta:
          $ref: '#/components/schemas/FoundationResponseMeta'
    HealthUnavailable:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: not_ready
    TagType:
      type: string
      enum:
      - string
      - integer
      - boolean
      - enum
    TagVisibility:
      type: string
      enum:
      - internal
      - restricted
    TagScalar:
      oneOf:
      - type: string
        minLength: 1
        maxLength: 128
      - type: integer
        minimum: -1000000000
        maximum: 1000000000
      - type: boolean
      description: Actual type must match the immutable tag definition. String values must be NFC-normalized,
        nonempty and free of control characters.
    TagDefinitionCreate:
      type: object
      additionalProperties: false
      required:
      - namespace
      - key
      - value_type
      - governed
      - visibility
      properties:
        namespace:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,39}$
          maxLength: 40
        key:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,39}$
          maxLength: 40
        value_type:
          $ref: '#/components/schemas/TagType'
        enum_values:
          type: array
          uniqueItems: true
          minItems: 2
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64
        governed:
          type: boolean
        visibility:
          $ref: '#/components/schemas/TagVisibility'
        description:
          type: string
          maxLength: 500
          default: ''
    TagDefinition:
      type: object
      additionalProperties: false
      required:
      - organization_id
      - namespace
      - key
      - value_type
      - enum_values
      - governed
      - visibility
      - description
      - created_by
      - created_at
      properties:
        organization_id:
          type: string
          format: uuid
          readOnly: true
        namespace:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,39}$
        key:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,39}$
        value_type:
          $ref: '#/components/schemas/TagType'
        enum_values:
          type:
          - array
          - 'null'
          items:
            type: string
        governed:
          type: boolean
        visibility:
          $ref: '#/components/schemas/TagVisibility'
        description:
          type: string
        created_by:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    TagAssignmentPut:
      type: object
      additionalProperties: false
      required:
      - value
      properties:
        value:
          $ref: '#/components/schemas/TagScalar'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Mandatory when tag definition is governed.
    TagAssignment:
      type: object
      additionalProperties: false
      required:
      - agent_id
      - namespace
      - key
      - value
      - revision
      - governed
      - visibility
      - created_by
      - updated_by
      - created_at
      - updated_at
      properties:
        agent_id:
          type: string
          format: uuid
          readOnly: true
        namespace:
          type: string
          readOnly: true
        key:
          type: string
          readOnly: true
        value:
          $ref: '#/components/schemas/TagScalar'
        revision:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        governed:
          type: boolean
          readOnly: true
        visibility:
          $ref: '#/components/schemas/TagVisibility'
        created_by:
          type: string
          format: uuid
          readOnly: true
        updated_by:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    TagPredicate:
      type: object
      additionalProperties: false
      required:
      - namespace
      - key
      - operator
      - value
      properties:
        namespace:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,39}$
        key:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,39}$
        operator:
          type: string
          const: eq
        value:
          $ref: '#/components/schemas/TagScalar'
    AgentTagSearch:
      type: object
      additionalProperties: false
      properties:
        tags:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/TagPredicate'
          description: All predicates are AND; repeated identical keys are rejected.
        status:
          $ref: '#/components/schemas/AgentStatus'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        cursor:
          type: string
          minLength: 1
          maxLength: 4096
      minProperties: 1
    TagDefinitionResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/TagDefinition'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    TagDefinitionListResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TagDefinition'
        meta:
          $ref: '#/components/schemas/PageMeta'
    TagAssignmentResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/TagAssignment'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    TagAssignmentListResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/TagAssignment'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CapabilityId:
      type: string
      minLength: 3
      maxLength: 164
      pattern: ^[a-z][a-z0-9_-]{0,39}(\.[a-z][a-z0-9_-]{0,39}){1,3}$
      description: Organization-scoped dot-separated namespace with 2 to 4 lowercase segments.
    CapabilityVersion:
      type: string
      maxLength: 32
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
      description: Three-part strict numeric semantic version; no pre-release/build syntax in Slice 3.
    EndpointKey:
      type: string
      minLength: 1
      maxLength: 40
      pattern: ^[a-z][a-z0-9_-]{0,39}$
    CapabilityContract:
      type: object
      description: A restricted, self-contained JSON Schema Draft 2020-12 object. Reject all $ref, $dynamicRef,
        $id and remote references; JSON depth max 12, nodes max 300, serialized size max 32 KiB. Validate syntax
        server side; do not execute arbitrary schemas.
      additionalProperties: true
    CapabilityPublish:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - display_name
      - input_schema
      - output_schema
      properties:
        id:
          $ref: '#/components/schemas/CapabilityId'
        version:
          $ref: '#/components/schemas/CapabilityVersion'
        display_name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
        input_schema:
          $ref: '#/components/schemas/CapabilityContract'
        output_schema:
          $ref: '#/components/schemas/CapabilityContract'
    Capability:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - organization_id
      - display_name
      - description
      - input_schema
      - output_schema
      - contract_sha256
      - verification
      - published_by
      - published_at
      properties:
        id:
          $ref: '#/components/schemas/CapabilityId'
        version:
          $ref: '#/components/schemas/CapabilityVersion'
        organization_id: &id005
          type: string
          format: uuid
        display_name:
          type: string
        description:
          type: string
        input_schema:
          $ref: '#/components/schemas/CapabilityContract'
        output_schema:
          $ref: '#/components/schemas/CapabilityContract'
        contract_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        verification:
          type: string
          const: self_declared
        published_by: *id005
        published_at: &id006
          type: string
          format: date-time
    EndpointProtocol:
      type: string
      enum:
      - a2a
      - mcp
      - http_json
    EndpointAuthScheme:
      type: string
      enum:
      - oauth2
      - mtls
      - api_key
      - none
      description: Declaration only, NOT a credential. No tokens, secrets, or authentication headers.
    EndpointPut:
      type: object
      additionalProperties: false
      required:
      - protocol
      - url
      - auth_scheme
      properties:
        protocol:
          $ref: '#/components/schemas/EndpointProtocol'
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Absolute HTTPS URL without userinfo, fragment, query, or embedded credentials; no network
            fetch.
        auth_scheme:
          $ref: '#/components/schemas/EndpointAuthScheme'
        enabled:
          type: boolean
          default: true
    Endpoint:
      type: object
      additionalProperties: false
      required:
      - agent_id
      - key
      - protocol
      - url
      - auth_scheme
      - enabled
      - revision
      - verification
      - created_by
      - updated_by
      - created_at
      - updated_at
      properties:
        agent_id: *id005
        key:
          $ref: '#/components/schemas/EndpointKey'
        protocol:
          $ref: '#/components/schemas/EndpointProtocol'
        url:
          type: string
          format: uri
        auth_scheme:
          $ref: '#/components/schemas/EndpointAuthScheme'
        enabled:
          type: boolean
        revision:
          type: integer
          minimum: 1
        verification:
          type: string
          const: self_declared
        created_by: *id005
        updated_by: *id005
        created_at: *id006
        updated_at: *id006
    BindingPut:
      type: object
      additionalProperties: false
      required:
      - version
      - endpoint_key
      properties:
        version:
          $ref: '#/components/schemas/CapabilityVersion'
        endpoint_key:
          $ref: '#/components/schemas/EndpointKey'
    Binding:
      type: object
      additionalProperties: false
      required:
      - agent_id
      - capability_id
      - version
      - endpoint_key
      - revision
      - verification
      - created_by
      - updated_by
      - created_at
      - updated_at
      properties:
        agent_id: *id005
        capability_id:
          $ref: '#/components/schemas/CapabilityId'
        version:
          $ref: '#/components/schemas/CapabilityVersion'
        endpoint_key:
          $ref: '#/components/schemas/EndpointKey'
        revision:
          type: integer
          minimum: 1
        verification:
          type: string
          const: self_declared
        created_by: *id005
        updated_by: *id005
        created_at: *id006
        updated_at: *id006
    DiscoveryCapability:
      type: object
      additionalProperties: false
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/CapabilityId'
        version:
          $ref: '#/components/schemas/CapabilityVersion'
    DiscoveryRequest:
      type: object
      additionalProperties: false
      required:
      - capability
      properties:
        capability:
          $ref: '#/components/schemas/DiscoveryCapability'
        tags:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/TagPredicate'
        protocols:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EndpointProtocol'
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 25
        cursor:
          type: string
          minLength: 1
          maxLength: 4096
      description: Local only. Active agents with active bindings to enabled endpoints. Exact capability key,
        optional exact version, AND tag equality. Sorted by agent UUID asc; opaque signed cursor. A match is
        not invocation authority or liveness.
    DiscoveryMatch:
      type: object
      additionalProperties: false
      required:
      - agent
      - capability
      - binding
      - endpoint
      - invocation_authorization
      - availability
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
        capability:
          type: object
          additionalProperties: false
          required:
          - id
          - version
          - verification
          properties:
            id:
              $ref: '#/components/schemas/CapabilityId'
            version:
              $ref: '#/components/schemas/CapabilityVersion'
            verification:
              type: string
              const: self_declared
        binding:
          $ref: '#/components/schemas/Binding'
        endpoint:
          $ref: '#/components/schemas/Endpoint'
        invocation_authorization:
          type: string
          const: not_evaluated
        availability:
          type: string
          const: not_checked
    CapabilityResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Capability'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EndpointResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Endpoint'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    BindingResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Binding'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CapabilityListResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        meta:
          $ref: '#/components/schemas/PageMeta'
    EndpointListResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    BindingListResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Binding'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DiscoveryResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryMatch'
        meta:
          $ref: '#/components/schemas/PageMeta'
  responses:
    AgentChanged:
      description: Agent state after transition (no-op transitions retain revision)
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentResponse'
    BadRequest:
      description: Invalid syntax, cursor, idempotency key, or request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Principal lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Agent does not exist in the authenticated organization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Invalid state transition, or conflicting idempotency request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PreconditionFailed:
      description: If-Match did not match current resource revision
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PreconditionRequired:
      description: If-Match is required for mutation of an existing agent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unprocessable:
      description: Well-formed body does not satisfy schema or business validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Body exceeds configured size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: Unsupported body content type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Tenant/principal rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Required service dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    HealthUnavailable:
      description: Process is not ready to serve traffic
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthUnavailable'
          example:
            status: not_ready
    FoundationBadRequest:
      description: Malformed request or unknown query parameters
      headers:
        X-Request-Id:
          $ref: '#/components/headers/FoundationRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request.
            meta:
              request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda
              api_version: v1
    FoundationUnauthorized:
      description: Missing, unknown, invalid, expired, or revoked credential; inactive principal or organization
      headers:
        X-Request-Id:
          $ref: '#/components/headers/FoundationRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Invalid or missing API credential.
            meta:
              request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda
              api_version: v1
    FoundationForbidden:
      description: Authenticated principal lacks required action scope
      headers:
        X-Request-Id:
          $ref: '#/components/headers/FoundationRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Insufficient permission.
            meta:
              request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda
              api_version: v1
    FoundationRateLimited:
      description: Caller exceeds request quota
      headers:
        X-Request-Id:
          $ref: '#/components/headers/FoundationRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Request limit exceeded.
            meta:
              request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda
              api_version: v1
    InternalError:
      description: Unexpected application failure (internal details redacted)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/FoundationRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error.
            meta:
              request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda
              api_version: v1
    DependencyUnavailable:
      description: Required database or other critical dependency unavailable
      headers:
        X-Request-Id:
          $ref: '#/components/headers/FoundationRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: DEPENDENCY_UNAVAILABLE
              message: Service temporarily unavailable.
            meta:
              request_id: 3b0fb35b-3c4c-489a-90fa-17232c7b8fda
              api_version: v1
