        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agents/{agentId}/endpoints:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    get:
      tags:
      - Endpoints
      operationId: listAgentEndpoints
      summary: List live endpoint declarations
      description: Requires agents:read AND endpoints:read; metadata only; no probing. Maximum eight active
        endpoints per agent.
      responses:
        '200':
          description: Active endpoints
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
